services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PORT: ${DB_PORT}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - msm-net

  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
    ports:
      - ${API_PORT}:${API_PORT}
    networks:
      - msm-net

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
    depends_on:
      - postgres
    networks:
      - msm-net

volumes:
  postgres-data:
    name: postgres-data

networks:
  msm-net:
    driver: bridge
